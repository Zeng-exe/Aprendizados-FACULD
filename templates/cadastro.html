<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Criar conta</h1>

            <p class="subtitulo">
                Cadastre-se para continuar
            </p>

            <form method="POST">

                <div class="campo">
                    <label>Nome completo</label>

                    <input
                        type="text"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label>E-mail</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label>Usuário</label>

                    <input
                        type="text"
                        name="usuario"
                        placeholder="Escolha um usuário"
                        required
                    >
                </div>

                <div class="campo">
                    <label>Senha</label>

                    <input
                        type="password"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <button type="submit">
                    Criar conta
                </button>

            </form>

            {% if mensagem %}
                <p class="mensagem">{{ mensagem }}</p>
            {% endif %}

            <p class="voltar">
                Já possui uma conta?
                <a href="/">Entrar</a>
            </p>

        </div>

    </div>

</body>

</html>
